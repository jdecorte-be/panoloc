[project]
name = "panoloc"
version = "0.1.0"
description = "Use depth estimation or photogrammetry to precisely locate objects detected in images (signs, etc.), beyond the approximate position where the photo was taken."
readme = "README.md"
authors = [
    { name = "perigoose", email = "perigoose@noreply.codeberg.org" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "pydeck>=0.9.3",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "watchdog>=6.0.0",
]

[project.scripts]
panoloc = "panoloc:main"

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "standard"
