[project]
name = "panoloc"
version = "0.1.0"
description = "Use depth estimation or photogrammetry to precisely locate objects detected in images (signs, etc.), beyond the approximate position where the photo was taken."
readme = "README.md"
authors = [
    { name = "jdecorte", email = "jdecorte@student.42belgium.be" },
    { name = "nthys", email = "nthys@student.42belgium.be" },
    { name = "perigoose", email = "perigoose@noreply.codeberg.org" },
    { name = "pfauveau", email = "git@thecakeis.top" }
]
requires-python = ">=3.14"
dependencies = [
    "depth-pro",
    "pillow>=12.3.0",
    "pydeck>=0.9.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "streamlit>=1.65.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
]

[tool.uv.sources]
depth-pro = { git = "https://github.com/apple-aiml-research/ml-depth-pro.git" }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
