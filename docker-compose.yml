services:
  mongodb:
    image: mongo:8.0
    container_name: panoloc-mongodb
    restart: unless-stopped
    # WiredTiger's cache, by default half the RAM: left to the locate workers
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-2}"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-panoloc}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-panoloc}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-panoloc}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
