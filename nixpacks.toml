# Dokploy (build type Nixpacks, build path /): the Next.js map of web/, no Python: it
# reads the signs `make push-signs` located (run where the pictures and torch are).
# Set MONGODB_URI (and MONGODB_DB / MONGODB_COLLECTION if not the defaults) in Dokploy,
# fill that MongoDB with `make populate`, and set SIGNS_URI (SIGNS_DB / SIGNS_COLLECTION)
# when push-signs writes to another one.

# no auto-detection: the root pyproject.toml would install all of panoloc, torch included
providers = []

[variables]
NEXT_TELEMETRY_DISABLED = "1"

[phases.setup]
# nixos-26.05, for pnpm 10
nixpkgsArchive = "7c8764b7c7b09b34f632464276218ef9090eaa11"
nixPkgs = ["nodejs_22", "pnpm_10"]

[phases.install]
cmds = ["pnpm --dir web install --frozen-lockfile"]
cacheDirectories = ["/root/.local/share/pnpm/store"]

[phases.build]
dependsOn = ["install"]
cmds = ["pnpm --dir web build"]
cacheDirectories = ["web/.next/cache"]

[start]
cmd = "pnpm --dir web start"
