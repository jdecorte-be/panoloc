# Dokploy (build type Nixpacks, build path /): the Next.js map of web/, and the Python
# locator that its /api/located starts (`python -m panoloc.locate serve`, from ../.venv).
# Set MONGODB_URI (and MONGODB_DB / MONGODB_COLLECTION if not the defaults) in Dokploy,
# then fill that MongoDB with `make populate`.

# no auto-detection: the root pyproject.toml would install all of panoloc, torch included
providers = []

[variables]
NEXT_TELEMETRY_DISABLED = "1"
UV_PYTHON_DOWNLOADS = "never"

[phases.setup]
# nixos-26.05, for python314 (.python-version), uv 0.11 (uv.lock) and pnpm 10
nixpkgsArchive = "7c8764b7c7b09b34f632464276218ef9090eaa11"
nixPkgs = ["nodejs_22", "pnpm_10", "python314", "uv"]

[phases.install]
# the locator imports pymongo, requests and pillow, at their uv.lock versions: the rest
# (depth-pro and its torch, the Streamlit app, scipy and numpy 1.26 that has no 3.14 wheel) is pruned
cmds = [
  "uv venv --python python3.14 .venv",
  "uv export --frozen --no-dev --no-hashes --no-emit-project --prune depth-pro --prune pydeck --prune scipy --prune streamlit --prune watchdog -o /tmp/requirements.txt",
  "uv pip install --python .venv/bin/python -r /tmp/requirements.txt",
  "uv pip install --python .venv/bin/python --no-deps -e .",
  "pnpm --dir web install --frozen-lockfile",
]
cacheDirectories = ["/root/.cache/uv", "/root/.local/share/pnpm/store"]

[phases.build]
dependsOn = ["install"]
cmds = ["pnpm --dir web build"]
cacheDirectories = ["web/.next/cache"]

[start]
cmd = "pnpm --dir web start"
